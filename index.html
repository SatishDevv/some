<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love ❤️</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Card -->
  <div class="bg-white shadow-2xl rounded-2xl p-6 max-w-md text-center mb-6">
    
    <img src="https://via.placeholder.com/150" 
         class="w-32 h-32 rounded-full mx-auto mb-4 border-4 border-pink-300">

    <h1 class="text-3xl font-bold text-pink-500 mb-2">
      Hi My Love 💕
    </h1>

    <p class="text-gray-700 mb-4">
      Every moment with you is special. You are my happiness 💖
    </p>

    <button onclick="showMessage()" 
      class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-2 rounded-full">
      Click Me 💌
    </button>

    <p id="secret" class="hidden mt-4 text-pink-600 font-semibold">
      I love you more than words can say ❤️✨
    </p>

    <button onclick="toggleMusic()" 
      class="mt-4 text-sm text-pink-500 underline">
      Play / Pause Music 🎵
    </button>
  </div>

  <!-- Photo Gallery -->
  <div class="max-w-4xl w-full">
    <h2 class="text-2xl font-bold text-pink-600 text-center mb-4">
      Our Beautiful Memories 📸
    </h2>

    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <img src="https://via.placeholder.com/300" class="rounded-xl shadow-md hover:scale-105 transition">
      <img src="https://via.placeholder.com/301" class="rounded-xl shadow-md hover:scale-105 transition">
      <img src="https://via.placeholder.com/302" class="rounded-xl shadow-md hover:scale-105 transition">
      <img src="https://via.placeholder.com/303" class="rounded-xl shadow-md hover:scale-105 transition">
      <img src="https://via.placeholder.com/304" class="rounded-xl shadow-md hover:scale-105 transition">
      <img src="https://via.placeholder.com/305" class="rounded-xl shadow-md hover:scale-105 transition">
    </div>
  </div>

  <!-- Background Music -->
  <audio id="bgMusic" autoplay loop>
    <source src="https://archive.org/download/FreebeatRomanticprod.BySkellonViaInstrumentals.com.ng/Freebeat-Romanticprod.-by-skellon%20via%20instrumentals.com.ng.MP3" type="audio/mpeg">
  </audio>

  <script>
    function showMessage() {
      document.getElementById('secret').classList.remove('hidden');
    }

    function toggleMusic() {
      const music = document.getElementById('bgMusic');
      if (music.paused) {
        music.play();
      } else {
        music.pause();
      }
    }

    window.addEventListener('click', () => {
      const music = document.getElementById('bgMusic');
      music.play().catch(() => {});
    }, { once: true });
  </script>

</body>
</html>
