<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Memories ❤️</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: radial-gradient(circle, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
    overflow-x: hidden;
  }
  @keyframes gradientBG {0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

  /* Slider */
  .slider-container {
    position: relative;
    width: 90%;
    max-width: 700px;
    height: 600px;
    overflow: hidden;
    border-radius: 25px;
    box-shadow: 0 0 35px rgba(255,105,180,0.6);
    margin-bottom: 1rem;
  }
  .slider-slide {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.7s ease, transform 0.7s ease;
    object-fit: cover;
    border-radius: 25px;
  }
  .slider-slide.active { opacity: 1; transform: scale(1); }
  .slider-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,105,180,0.8);
    color: white;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size: 28px;
    z-index: 10;
  }
  .slider-btn.left { left: 10px; }
  .slider-btn.right { right: 10px; }
  .message {
    text-align:center;
    font-size:1.3rem;
    color:#ff1a75;
    margin-bottom:2rem;
    min-height:2rem;
  }

  .heart { 
    position: fixed; 
    bottom:-10px; 
    animation: floatUp linear forwards; 
    color: pink; 
    font-size: 20px; 
  }
  @keyframes floatUp {0%{transform: translateY(0); opacity:1;}100%{transform: translateY(-100vh) scale(1.5); opacity:0;}}

  /* Responsive slider height */
  @media (max-width: 768px) { .slider-container { height: 450px; } }
  @media (max-width: 480px) { .slider-container { height: 300px; } }
</style>
</head>
<body>

<h1 class="text-4xl font-bold text-pink-600 mb-4">Our Love Memories ❤️</h1>

<div class="slider-container" id="slider">
  <div class="slider-btn left" onclick="prevSlide()">‹</div>
  <div class="slider-btn right" onclick="nextSlide()">›</div>
</div>

<div class="message" id="slideMessage"></div>

<!-- Surprise button -->
<button onclick="showPopup()" class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-2 rounded-full mb-6">Open Surprise 🎁</button>

<!-- Popup -->
<div id="popup" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-20">
  <div class="bg-white p-8 rounded-2xl text-center shadow-xl relative">
    <h2 class="text-2xl font-bold text-pink-500 mb-4">Will You Be Mine, Emma? 💖</h2>
    <div class="flex justify-center gap-4 relative h-12">
      <button onclick="showHearts()" class="bg-green-500 text-white px-4 py-2 rounded-full">Yes 💕</button>
      <button id="noBtn" onmouseover="moveNo()" class="bg-red-500 text-white px-4 py-2 rounded-full absolute">No 😢</button>
    </div>
    <p id="response" class="mt-4 text-pink-600 font-semibold"></p>
  </div>
</div>

<!-- Audio -->
<audio id="bgMusic" loop><source src="src/music.mp3" type="audio/mpeg"></audio>
<audio id="yesSound"><source src="src/yes.mp3" type="audio/mpeg"></audio>

<script>
  const gfName = "Emma"; // personalize here

  // Slider images + romantic/caring messages
  const slides = [
    {src:'src/one.jpeg', msg:`First time we met, ${gfName} 😍`},
    {src:'src/two.jpeg', msg:`Our cute selfie together, ${gfName} 💕`},
    {src:'src/three.jpeg', msg:`Fun times with you, ${gfName} 🌸`},
    {src:'src/four.jpeg', msg:`Laughing together, ${gfName} 😂`},
    {src:'src/fift.jpeg', msg:`Sweet memories, ${gfName} 💖`},
    {src:'src/six.jpeg', msg:`Weekend adventures with ${gfName} 🌙`},
    {src:'src/seven.jpeg', msg:`Romantic vibes, ${gfName} ❤️`},
    {src:'src/aight.jpeg', msg:`Special day with ${gfName} 🌹`},
    {src:'src/nine.jpeg', msg:`Always smiling together, ${gfName} 😘`},
    {src:'src/ten.jpeg', msg:`Forever us, ${gfName} 💑`},
    {src:'src/12.jpeg', msg:`Love you endlessly, ${gfName} 💗`},
    {src:'src/13.jpeg', msg:`Beautiful moments, ${gfName} 🌟`},
    {src:'src/14.jpeg', msg:`Happiest day with ${gfName} 💖`},
    {src:'src/15.jpeg', msg:`You & Me, ${gfName} ❤️`},
    {src:'src/16.jpeg', msg:`Our journey together, ${gfName} 💕`}
  ];

  const sliderContainer = document.getElementById('slider');
  const slideMessage = document.getElementById('slideMessage');
  let currentSlide = 0;

  slides.forEach((slide,i)=>{
    const img = document.createElement('img');
    img.src = slide.src;
    img.className = 'slider-slide';
    if(i===0) img.classList.add('active');
    sliderContainer.appendChild(img);
  });

  const slideElems = document.querySelectorAll('.slider-slide');

  function showSlide(index){
    slideElems.forEach((s,i)=>s.classList.toggle('active', i===index));
    slideMessage.innerText = slides[index].msg;
  }

  function nextSlide(){
    currentSlide = (currentSlide + 1) % slides.length;
    showSlide(currentSlide);
  }

  function prevSlide(){
    currentSlide = (currentSlide - 1 + slides.length) % slides.length;
    showSlide(currentSlide);
  }

  // Swipe support
  let startX=0;
  sliderContainer.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; });
  sliderContainer.addEventListener('touchend', e=>{
    const diff = e.changedTouches[0].clientX - startX;
    if(diff>50) prevSlide();
    else if(diff<-50) nextSlide();
  });

  // Hearts popup
  function showHearts(){
    document.getElementById('popup').classList.add('hidden');
    document.getElementById('yesSound').play();
    startHearts();
    document.getElementById('response').innerText = `I LOVE YOU SO MUCH ❤️😍, ${gfName}!`;
  }

  function startHearts(){
    for(let i=0;i<50;i++){
      setTimeout(()=>{
        const heart=document.createElement('div');
        heart.className='heart';
        heart.innerText='❤️';
        heart.style.left=Math.random()*100+'vw';
        heart.style.fontSize=(Math.random()*20+10)+'px';
        heart.style.animationDuration=(Math.random()*2+3)+'s';
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),5000);
      },i*100);
    }
  }

  // NO button escapes
  function moveNo(){
    const btn = document.getElementById('noBtn');
    const parent = btn.parentElement;
    const rect = parent.getBoundingClientRect();
    const maxX = rect.width - btn.offsetWidth;
    const maxY = rect.height - btn.offsetHeight;
    btn.style.position = "absolute";
    btn.style.left = Math.random()*maxX + "px";
    btn.style.top = Math.random()*maxY + "px";
  }

  // Music autoplay
  window.addEventListener('click',()=>{document.getElementById('bgMusic').play().catch(()=>{});},{once:true});
</script>

</body>
</html>
